<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anchored VWAP Fixture Harness</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0b0e14;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: #151b23;
      border-bottom: 1px solid #30363d;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .title { font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 8px; }
    .badge { background: #1f6feb; color: #fff; font-size: 11px; padding: 2px 6px; border-radius: 4px; }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    button, select {
      background: #21262d;
      border: 1px solid #363b42;
      color: #c9d1d9;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
    button:hover, select:hover { background: #30363d; border-color: #8b949e; }
    button.active { background: #1f6feb; border-color: #58a6ff; color: #fff; }
    #stats {
      background: #161b22;
      border-bottom: 1px solid #21262d;
      padding: 6px 16px;
      font-size: 12px;
      color: #8b949e;
      display: flex;
      gap: 16px;
      overflow-x: auto;
    }
    .stat-val { color: #f0f6fc; font-weight: 500; }
    #viewport-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #030712;
      overflow: auto;
      padding: 10px;
    }
    #chart-frame {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      position: relative;
    }
    #chart-container {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <header>
    <div class="title">
      <span>BTCUSDT Anchored VWAP</span>
      <span class="badge">Isolated Fixture Harness</span>
    </div>
    <div class="controls">
      <button id="btn-desktop" class="active">Desktop (1440x900)</button>
      <button id="btn-mobile">Mobile (390x844)</button>
      <span style="color: #484f58">|</span>
      <select id="sel-anchor">
        <option value="0" selected>Anchor: Candle 0 (Origin)</option>
        <option value="80">Anchor: Candle 80 (Swing High)</option>
        <option value="150">Anchor: Candle 150 (Pullback Low)</option>
      </select>
      <select id="sel-source">
        <option value="typical" selected>Source: Typical (HLC/3)</option>
        <option value="close">Source: Close</option>
        <option value="hl2">Source: HL/2</option>
        <option value="ohlc4">Source: OHLC/4</option>
      </select>
      <button id="btn-bands" class="active">Bands (1σ, 2σ, 3σ)</button>
      <button id="btn-fill">Band Fill: Off</button>
      <button id="btn-anchor-line" class="active">Anchor Line</button>
      <button id="btn-replay">Mode: Live</button>
    </div>
  </header>
  <div id="stats">
    <div>Anchor Time: <span id="stat-anchor" class="stat-val">-</span></div>
    <div>Current AVWAP: <span id="stat-vwap" class="stat-val" style="color: #58a6ff">-</span></div>
    <div>StdDev (σ): <span id="stat-stddev" class="stat-val">-</span></div>
    <div>Upper 1σ: <span id="stat-upper" class="stat-val" style="color: #29b57a">-</span></div>
    <div>Lower 1σ: <span id="stat-lower" class="stat-val" style="color: #e05263">-</span></div>
    <div>Cum Volume: <span id="stat-vol" class="stat-val">-</span></div>
    <div>Points: <span id="stat-points" class="stat-val">-</span></div>
  </div>
  <div id="viewport-wrapper">
    <div id="chart-frame" style="width: 1440px; height: 800px;">
      <div id="chart-container"></div>
    </div>
  </div>
  <script type="module" src="./bundle.js"></script>
</body>
</html>
