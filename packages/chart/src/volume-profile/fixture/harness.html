<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Volume Profile Fixture Harness</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0b0e14;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: #151b23;
      border-bottom: 1px solid #30363d;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .title { font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 8px; }
    .badge { background: #238636; color: #fff; font-size: 11px; padding: 2px 6px; border-radius: 4px; }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    button, select {
      background: #21262d;
      border: 1px solid #363b42;
      color: #c9d1d9;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
    button:hover, select:hover { background: #30363d; border-color: #8b949e; }
    button.active { background: #1f6feb; border-color: #58a6ff; color: #fff; }
    #stats {
      background: #161b22;
      border-bottom: 1px solid #21262d;
      padding: 6px 16px;
      font-size: 12px;
      color: #8b949e;
      display: flex;
      gap: 16px;
      overflow-x: auto;
    }
    .stat-val { color: #f0f6fc; font-weight: 500; }
    #viewport-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #030712;
      overflow: auto;
      padding: 10px;
    }
    #chart-frame {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      position: relative;
    }
    #chart-container {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <header>
    <div class="title">
      <span>BTCUSDT Volume Profile (VP-001)</span>
      <span class="badge">Isolated Fixture Harness</span>
    </div>
    <div class="controls">
      <button id="btn-desktop" class="active">Desktop (1440x900)</button>
      <button id="btn-mobile">Mobile (390x844)</button>
      <span style="color: #484f58">|</span>
      <button id="btn-placement">Align: Right</button>
      <button id="btn-width">Width: 25%</button>
      <button id="btn-poc" class="active">POC</button>
      <button id="btn-vah-val" class="active">VAH/VAL</button>
      <button id="btn-va-shade" class="active">VA Shading</button>
      <button id="btn-direction">Candle Direction</button>
      <select id="sel-bins">
        <option value="rowCount-24">24 Rows</option>
        <option value="rowCount-50" selected>50 Rows</option>
        <option value="rowCount-100">100 Rows</option>
        <option value="binSize-25">Bin Size $25</option>
      </select>
      <button id="btn-replay">Mode: Live</button>
    </div>
  </header>
  <div id="stats">
    <div>Total Vol: <span id="stat-vol" class="stat-val">-</span></div>
    <div>POC: <span id="stat-poc" class="stat-val" style="color: #d97706">-</span></div>
    <div>VAH: <span id="stat-vah" class="stat-val" style="color: #3b82f6">-</span></div>
    <div>VAL: <span id="stat-val-el" class="stat-val" style="color: #3b82f6">-</span></div>
    <div>Achieved VA: <span id="stat-va" class="stat-val">-</span></div>
    <div>Eligible Candles: <span id="stat-candles" class="stat-val">-</span></div>
  </div>
  <div id="viewport-wrapper">
    <div id="chart-frame" style="width: 1440px; height: 800px;">
      <div id="chart-container"></div>
    </div>
  </div>
  <script type="module" src="./bundle.js"></script>
</body>
</html>
